<script>
/* The post list: a preview video plays over the cover of a post.
   With a mouse, it plays while the pointer or the keyboard focus is on the
   entry. On a touch screen there is no hover, so the entry that is mostly in
   view plays, and only one at a time. It never plays for a reader who asks
   the system to reduce motion. */
(function () {
  var entries = Array.prototype.slice.call(document.querySelectorAll(".kiln-list .entry"))
    .filter(function (entry) { return entry.querySelector("video"); });
  if (!entries.length) return;

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var mouse = window.matchMedia("(hover: hover) and (pointer: fine)");
  var current = null;

  function stop(entry) {
    var video = entry.querySelector("video");
    entry.classList.remove("is-previewing");
    video.pause();
    if (video.readyState > 0) video.currentTime = 0;
    if (current === entry) current = null;
  }

  function play(entry) {
    if (reduce.matches || current === entry) return;
    if (current) stop(current);
    var started = entry.querySelector("video").play();
    current = entry;
    // A browser may refuse, or the file may be missing. The cover stays.
    if (started && started.catch) started.catch(function () { stop(entry); });
  }

  // The video fades in only when a frame is on the screen.
  entries.forEach(function (entry) {
    entry.querySelector("video").addEventListener("playing", function () {
      if (current === entry) entry.classList.add("is-previewing");
    });
  });

  if (mouse.matches) {
    entries.forEach(function (entry) {
      entry.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") play(entry); });
      entry.addEventListener("pointerleave", function () { stop(entry); });
      entry.addEventListener("focusin", function () { play(entry); });
      entry.addEventListener("focusout", function () { stop(entry); });
    });
  } else if ("IntersectionObserver" in window) {
    var ratios = new Map();
    var observer = new IntersectionObserver(function (changes) {
      changes.forEach(function (c) { ratios.set(c.target.closest(".entry"), c.intersectionRatio); });
      var best = null;
      ratios.forEach(function (ratio, entry) {
        if (ratio >= 0.6 && (!best || ratio > ratios.get(best))) best = entry;
      });
      if (current && current !== best) stop(current);
      if (best) play(best);
    }, { threshold: [0, 0.3, 0.6, 0.8, 1] });
    entries.forEach(function (entry) { observer.observe(entry.querySelector(".thumb")); });
  }

  // A reader who turns on reduced motion while the page is open.
  reduce.addEventListener("change", function () { if (reduce.matches && current) stop(current); });
})();
</script>

project:
  type: website
  output-dir: _site
  # Draws cover.png for the site and for each post. See scripts/covers.mjs.
  pre-render: node scripts/covers.mjs
  # The preview videos are used by the post list and by the posts, and the
  # list names them in a script, so Quarto would not find them itself.
  resources:
    - posts/*/preview.mp4
    - posts/*/preview.jpg

website:
  title: "Tanmay Chanda"
  site-url: https://tenmeh.github.io
  description: "Notes on R, Shiny, and building things that other people use."
  # The share image of a page that has none of its own. Each post sets its
  # own in posts/_metadata.yml. Both are drawn by scripts/covers.mjs.
  image: cover.png
  image-alt: "Tanmay Chanda. Notes on R, Shiny, and building things that other people use."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: "https://avatars.githubusercontent.com/u/81738153?v=4&s=96"
    logo-alt: "Tanmay Chanda"
    left:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/tenmeh
        aria-label: GitHub
      - icon: rss
        href: index.xml
        aria-label: RSS feed

  page-footer:
    left: "Tanmay Chanda"
    center: "Blogroll: [R-bloggers](https://www.r-bloggers.com/)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true
    highlight-style: github
    css: styles.css
    toc: true
    toc-title: "In this post"
    toc-depth: 2
    anchor-sections: true
    code-copy: true

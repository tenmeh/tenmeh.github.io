<g fill="#7356d6"><circle cx="26" cy="81" r="1.4"/><circle cx="32" cy="81" r="1.4"/><circle cx="38" cy="81" r="1.4"/><circle cx="44" cy="81" r="1.4"/><circle cx="50" cy="81" r="1.4"/><circle cx="56" cy="81" r="1.4"/><circle cx="62" cy="81" r="1.4"/><circle cx="68" cy="81" r="1.4"/><circle cx="74" cy="81" r="1.4"/></g>
<text x="50" y="97" class="ui" font-size="10.5" font-weight="600" fill="#17202a" text-anchor="middle">whence</text>
</g></g></g>

<clipPath id="cB"><rect x="52" y="228" width="26" height="34" rx="5"/><rect x="88" y="206" width="26" height="56" rx="5"/><rect x="124" y="220" width="26" height="42" rx="5"/><rect x="160" y="192" width="26" height="70" rx="5"/></clipPath>
<clipPath id="cR"><rect x="588" y="84" width="112" height="10" rx="5"/><rect x="588" y="104" width="150" height="10" rx="5"/><rect x="588" y="124" width="84" height="10" rx="5"/></clipPath>

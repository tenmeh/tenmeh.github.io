<!-- The scene of the bones hero (posts/2026-09-28-how-bones-began/hero.svg),
     laid out again on the 1200x630 card. The style block, the gradient, the
     shapes and the delays are copied from the hero as they are. Only the
     groups that hold them have new places (translate and scale), so the
     doodles stand around the hex and not in a row, and a few of them reach
     into the gap beside the text. Each group keeps the local coordinates of
     the hero, so a clip-path and a band still line up. -->
<style>
svg{display:block}
.sway,.spin,.bone,.fx,.fy,.fp,.tw,.fl,.wob,.shadow,.band{transform-box:view-box;transform-origin:0 0}
.sway{animation:sway 5.6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;opacity:.14;animation:shadow 5.6s ease-in-out infinite}
.bone{transform-origin:50px 38px;animation:bounce 5.6s infinite}
.band{animation:2.8s cubic-bezier(.45,.05,.55,.95) infinite}
.bandL{animation-name:sweepL}.bandH{animation-name:sweepH}.bandR{animation-name:sweepR}
.fx,.fy,.fp{transform-box:fill-box;animation:5.6s infinite both}
.fx{transform-origin:0 50%;animation-name:fx}
.fy{transform-origin:50% 100%;animation-name:fy}
.fp{transform-origin:50% 50%;animation-name:fp}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.fl{animation:fl 2.8s ease-in-out infinite}
.wob{animation:wob 2.8s ease-in-out infinite}
@keyframes sway{0%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-8px) rotate(0deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-8px) rotate(0deg)}100%{transform:translateY(0) rotate(-4deg)}}
@keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:.14}25%,75%{transform:scaleX(.86);opacity:.09}}
@keyframes bounce{
0%,17%{transform:translateY(0) rotate(0) scale(1,1)}
19.5%{transform:translateY(0) rotate(0) scale(1.12,.86);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
22.5%{transform:translateY(-6px) rotate(-7deg) scale(.94,1.1);animation-timing-function:cubic-bezier(.6,0,.9,.5)}
25.5%{transform:translateY(0) rotate(6deg) scale(1.1,.9)}
28%{transform:translateY(0) rotate(-3deg) scale(.98,1.03)}
30.5%,64%{transform:translateY(0) rotate(0) scale(1,1)}
67%{transform:translateY(0) rotate(-6deg) scale(1,1)}
70%{transform:translateY(0) rotate(6deg) scale(1,1)}
72.5%{transform:translateY(0) rotate(-3deg) scale(1,1)}
75%,100%{transform:translateY(0) rotate(0) scale(1,1)}}
@keyframes fx{0%,20%{transform:scaleX(0);opacity:1;animation-timing-function:cubic-bezier(.3,.7,.3,1)}32%,82%{transform:scaleX(1);opacity:1}90%{transform:scaleX(1);opacity:0}90.1%,100%{transform:scaleX(0);opacity:0}}
@keyframes fy{0%,20%{transform:scaleY(0);opacity:1;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}34%,82%{transform:scaleY(1);opacity:1}90%{transform:scaleY(1);opacity:0}90.1%,100%{transform:scaleY(0);opacity:0}}
@keyframes fp{0%,20%{transform:scale(0);opacity:1;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}30%,82%{transform:scale(1);opacity:1}90%{transform:scale(1);opacity:0}90.1%,100%{transform:scale(0);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes sweepL{0%,0%{transform:translateX(-150px)}36%,100%{transform:translateX(90px)}}
@keyframes sweepH{0%,20%{transform:translateX(-42px)}56%,100%{transform:translateX(36px)}}
@keyframes sweepR{0%,40%{transform:translateX(-140px)}76%,100%{transform:translateX(120px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<defs>
<linearGradient id="band"><stop offset="0" stop-color="#237A80" stop-opacity="0"/><stop offset=".5" stop-color="#237A80"/><stop offset="1" stop-color="#237A80" stop-opacity="0"/></linearGradient>
<clipPath id="cH"><rect x="21" y="58" width="58" height="6" rx="3"/><rect x="21" y="68" width="38" height="6" rx="3"/></clipPath>

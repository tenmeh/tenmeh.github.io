<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bones learned preview scene</title>
<!-- The scene for the first GIF of the bones 0.2.0 post. The app wraps a
     uiOutput() with withBones(). On the first visit, bones guesses the shape
     from the type of the output: a few lines of text. The content is three
     cards and some text. On the next visit, the skeleton has the shape that
     the browser learned: a frame for each card, and a bar for each line.

     The markup and the classes of the wrapper are what withBones() writes,
     and bones-0-2-0.css is the real stylesheet of bones 0.2.0 (MIT,
     Copyright (c) 2026 Tanmay Chanda). The learned skeleton is not drawn by
     hand: the scene measures the real content, as bones.js does, and builds
     the skeleton from those boxes. -->
<link rel="stylesheet" href="bones-0-2-0.css">
<link rel="stylesheet" href="app.css">
<style>
  /* What a bslib page gives bones. */
  :root {
    --bs-body-color: #212529;
    --bs-body-bg: #fff;
    --bs-border-radius: 0.375rem;
  }

  /* A plain browser bar, so a reload can be seen. */
  .browser {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 28px;
    padding: 0 12px;
    border-bottom: 1px solid #e3e6ea;
    background: #f4f5f7;
    color: #566176;
    font-size: 11px;
  }

  .browser .reload {
    display: inline-flex;
    width: 18px;
    height: 18px;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  .browser .url {
    flex: 1;
    padding: 3px 10px;
    border-radius: 999px;
    background: #fff;
  }

  .app { position: relative; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 12px 14px 0;
  }

  .top h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }

  .badge {
    padding: 3px 10px;
    border-radius: 999px;
    background: #f1f3f5;
    color: #343a40;
    font-size: 11px;
    font-weight: 700;
  }

  .card {
    margin: 10px 14px 0;
    border: 1px solid rgba(0, 0, 0, 0.175);
    border-radius: 6px;
    overflow: hidden;
  }

  .card-head {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.175);
    background: rgba(0, 0, 0, 0.03);
    font-weight: 600;
  }

  .card-body { padding: 10px; }

  /* The real content: three value boxes, then two short paragraphs. */
  .vbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .vb {
    padding: 8px 10px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
  }

  .vb .k { color: #6c757d; font-size: 10px; }
  .vb .v { font-size: 18px; font-weight: 800; line-height: 1.3; }

  .note { margin: 10px 0 0; font-size: 11px; line-height: 1.5; color: #343a40; }
</style>
</head>
<body>
<div id="stage">
  <div class="browser">
    <span class="reload" id="reload">
      <svg viewBox="0 0 16 16" width="12" height="12"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="#566176" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="url">127.0.0.1:4321</span>
  </div>

  <div class="app" id="app">
    <div class="top">
      <h1>Sales summary</h1>
      <span class="badge" id="badge">First visit</span>
    </div>

    <div class="card">
      <div class="card-head">North region</div>
      <div class="card-body">
        <div class="bones-wrap bones-anim-wave" id="wrap" data-bones-type="text"
             style="--bones-reserve: 72px; --bones-delay: 0ms;">
          <div class="bones-skeleton bones-skeleton-text" aria-hidden="true" id="guess">
            <div class="bones-bar" style="width: 100%;"></div>
            <div class="bones-bar" style="width: 94%;"></div>
            <div class="bones-bar" style="width: 62%;"></div>
          </div>
          <div class="bones-content" id="content">
            <div class="vbs">
              <div class="vb"><div class="k">Revenue</div><div class="v">$48.2k</div></div>
              <div class="vb"><div class="k">Orders</div><div class="v">476</div></div>
              <div class="vb"><div class="k">Customers</div><div class="v">38</div></div>
            </div>
            <p class="note">Revenue is up 6% on last month. Most of the growth came from three
              large orders in the second week.</p>
            <p class="note">Updated every hour from the orders database.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="caption"></div>
  <svg id="cursor"></svg>
  <div id="ripple"></div>
  <div id="veil"></div>
</div>

<script src="scene.js"></script>
<script>
  const DURATION = 11200;
  window.DURATION = DURATION;
  window.POSTER_MS = 6800; // the learned skeleton, with its caption

  const wrap = document.getElementById("wrap");
  const content = document.getElementById("content");
  const guess = document.getElementById("guess");

  // --- What the browser learns ------------------------------------------------
  // As recordLayout() in bones.js: a bar for each line of text, a frame for
  // each box with a border on all four sides, relative to the content. The
  // frames come first, so a bar is drawn over its card.
  wrap.classList.add("bones-loaded", "bones-has-loaded");
  const origin = content.getBoundingClientRect();
  const rel = (r) => [r.left - origin.left, r.top - origin.top, r.width, r.height];
  const frames = [...content.querySelectorAll(".vb")].map((el) => rel(el.getBoundingClientRect()));
  const bars = [];
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
  const range = document.createRange();
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (!/\S/.test(n.nodeValue)) continue;
    range.selectNodeContents(n);
    for (const r of range.getClientRects()) bars.push(rel(r));
  }
  const learnedHeight = Math.round(origin.height);
  wrap.classList.remove("bones-loaded", "bones-has-loaded");

  const learned = document.createElement("div");
  learned.className = "bones-skeleton bones-skeleton-learned";
  learned.setAttribute("aria-hidden", "true");
  const box = (cls, [x, y, w, h]) =>
    `<div class="${cls}" style="left: ${Math.round(x)}px; top: ${Math.round(y)}px; ` +
    `width: ${Math.round(w)}px; height: ${Math.round(h)}px;"></div>`;
  learned.innerHTML = frames.map((f) => box("bones-learned-frame", f)).join("") +
    bars.map((b) => box("bones-bar", b)).join("");

  // --- Where the pointer goes -------------------------------------------------
  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };
  const [rx, ry] = centre(document.getElementById("reload"));

  // A soft ring on the badge when the visit changes, so the eye finds it.
  const ring = (ms, t0) => {
    const p = clamp((ms - t0) / 900);
    return ms >= t0 && p < 1 ? `0 0 0 3px rgba(87, 88, 168, ${0.5 * (1 - p)})` : "";
  };

  // --- The story --------------------------------------------------------------
  //   400   first visit: the guessed text skeleton shows
  //  2900   the content arrives (three cards and two paragraphs)
  //  4300   the pointer goes to the reload button, and clicks at 5000
  //  5050   the page is blank while it reloads
  //  5400   next visit: the learned skeleton shows, at the learned height
  //  8600   the content arrives in the place of its skeleton
  let shownSkeleton = "guess";
  window.renderAt = function (ms) {
    const next = ms >= 5400;
    const want = next ? "learned" : "guess";
    if (want !== shownSkeleton) {
      wrap.replaceChild(want === "learned" ? learned : guess, wrap.querySelector(".bones-skeleton"));
      shownSkeleton = want;
    }
    wrap.style.setProperty("--bones-reserve", (next ? learnedHeight : 72) + "px");

    const loaded = next ? ms >= 8600 : ms >= 2900;
    wrap.classList.toggle("bones-loaded", loaded);
    wrap.classList.toggle("bones-has-loaded", loaded);
    // An output is empty until its value arrives, so only the reserve holds
    // the space. On the first visit the guess is short, and the page moves
    // when the content arrives. On the next visit the reserve was learned.
    content.style.display = loaded ? "" : "none";
    wrap.querySelector(".bones-skeleton").style.display = ms < 400 ? "none" : "";

    document.getElementById("app").style.opacity = ms >= 5050 && ms < 5400 ? 0 : 1;
    const badge = document.getElementById("badge");
    badge.textContent = ms >= 5050 ? "Next visit" : "First visit";
    badge.style.boxShadow = ring(ms, 5400);

    setCaption(ms, [
      [500, 2700, "First visit: bones guesses from the type, a few lines of text"],
      [3100, 4500, "The content is three cards and some text"],
      [5600, 8300, "Next visit: the skeleton has the shape that it learned"],
      [8800, 10700, "The content lands where its skeleton was"],
    ]);
    setCursor(ms, [[4300, 330, 200], [4900, rx, ry], [5300, rx, ry], [5700, 200, 140]], [5000]);
    setVeil(ms, DURATION);
    freezeAnimations(ms);
  };

  window.renderAt(0);
</script>
</body>
</html>

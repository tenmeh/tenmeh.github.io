<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bones failed preview scene</title>
<!-- The scene for the second GIF of the bones 0.2.0 post. The app wraps a
     tableOutput() with withBones(error = bones_error("The table could not
     be loaded."), retry = "table_retry"). A refresh fails. The old table
     stays, dimmed, and the error panel sits over it as a banner, with a Try
     again button. The click shows the skeleton while the output runs again,
     and the new table arrives.

     The markup and the classes of the wrapper are what withBones() writes,
     and bones-0-2-0.css is the real stylesheet of bones 0.2.0 (MIT,
     Copyright (c) 2026 Tanmay Chanda). renderAt(ms) sets the classes that
     bones.js would set at that time. -->
<link rel="stylesheet" href="bones-0-2-0.css">
<link rel="stylesheet" href="app.css">
<style>
  /* What a bslib page gives bones. */
  :root {
    --bs-body-color: #212529;
    --bs-body-bg: #fff;
    --bs-border-radius: 0.375rem;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 32px;
    margin: 14px 14px 0;
  }

  .top h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }

  /* Bootstrap 5, at the size of this scene. */
  .btn {
    padding: 4px 12px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
    color: #212529;
    font: inherit;
    font-weight: 600;
    line-height: 1.4;
  }

  .card {
    margin: 10px 14px 0;
    border: 1px solid rgba(0, 0, 0, 0.175);
    border-radius: 6px;
    overflow: hidden;
  }

  .card-head {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.175);
    background: rgba(0, 0, 0, 0.03);
    font-weight: 600;
  }

  .card-body { padding: 10px; }

  /* The real table, as tableOutput() draws it. */
  .rt { width: 100%; border-collapse: collapse; font-size: 11px; }

  .rt th,
  .rt td {
    height: 24px;
    padding: 0 4px;
    border-bottom: 1px solid #dee2e6;
    text-align: left;
    white-space: nowrap;
  }

  .rt th { border-bottom-width: 2px; font-weight: 600; }
  .rt .n { text-align: right; }

  .bones-error-message { font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <div class="top">
    <h1>Top customers</h1>
    <button class="btn" id="refresh">Refresh</button>
  </div>

  <div class="card">
    <div class="card-head">North region</div>
    <div class="card-body">
      <div class="bones-wrap bones-anim-wave" id="wrap" data-bones-type="table"
           data-bones-stale="true" data-bones-retry="table_retry"
           style="--bones-reserve: 120px; --bones-delay: 0ms;">
        <div class="bones-skeleton bones-skeleton-table" aria-hidden="true" id="skel-rows"></div>
        <div class="bones-content">
          <table class="rt">
            <thead><tr><th>Customer</th><th class="n">Orders</th><th class="n">Revenue</th></tr></thead>
            <tbody id="rt-body"></tbody>
          </table>
        </div>
        <div class="bones-error" role="alert">
          <div class="bones-error-message">The table could not be loaded.</div>
          <div class="bones-error-safe"></div>
          <button type="button" class="bones-retry" id="retry">Try again</button>
        </div>
      </div>
    </div>
  </div>

  <div id="caption"></div>
  <svg id="cursor"></svg>
  <div id="ripple"></div>
  <div id="veil"></div>
</div>

<script src="scene.js"></script>
<script>
  const DURATION = 11000;
  window.DURATION = DURATION;
  window.POSTER_MS = 3900; // the banner over the dimmed table, with its caption

  // The table shape of bones: a strong header row, then rows of three bars.
  const widths = ["100%", "80%", "92%"];
  const row = (strong) => `<div class="bones-row">${widths
    .map((w) => `<div class="bones-bar${strong ? " bones-bar-strong" : ""}" style="width: ${w};"></div>`)
    .join("")}</div>`;
  document.getElementById("skel-rows").innerHTML = row(true) + [1, 2, 3, 4].map(() => row(false)).join("");

  // The table before the refresh, and after the retry.
  const DATA = {
    before: [["Acme Corp", 128, "48,210"], ["Globex", 96, "39,870"], ["Initech", 84, "31,455"],
             ["Umbrella", 71, "27,120"]],
    after: [["Acme Corp", 131, "49,460"], ["Globex", 99, "40,915"], ["Initech", 84, "31,455"],
            ["Umbrella", 74, "28,040"]],
  };
  let drawn = "";
  function drawTable(which) {
    if (drawn === which) return;
    drawn = which;
    document.getElementById("rt-body").innerHTML = DATA[which]
      .map(([name, n, rev]) => `<tr><td>${name}</td><td class="n">${n}</td><td class="n">$${rev}</td></tr>`).join("");
  }

  const wrap = document.getElementById("wrap");
  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };
  const [fx, fy] = centre(document.getElementById("refresh"));
  // The Try again button shows only in the errored state. Measure it there.
  wrap.classList.add("bones-errored", "bones-has-loaded", "bones-loaded");
  drawTable("before");
  const [tx, ty] = centre(document.getElementById("retry"));
  wrap.classList.remove("bones-errored", "bones-has-loaded", "bones-loaded");

  // --- The story --------------------------------------------------------------
  //     0   the table is loaded
  //  1500   a click on Refresh: the table stays, dimmed (stale)
  //  2700   the load fails: the banner with Try again, over the dimmed table
  //  6000   a click on Try again: the skeleton shows (a hold) while it runs
  //  8400   the new table arrives
  window.renderAt = function (ms) {
    drawTable(ms >= 8400 ? "after" : "before");
    const stale = ms >= 1500 && ms < 2700;
    const errored = ms >= 2700 && ms < 6000;
    const held = ms >= 6000 && ms < 8400;
    wrap.classList.add("bones-has-loaded");
    wrap.classList.toggle("bones-loaded", !held);
    wrap.classList.toggle("bones-stale", stale);
    wrap.classList.toggle("bones-errored", errored);
    wrap.classList.toggle("bones-held", held);

    setCaption(ms, [
      [1700, 2600, "Refresh: the old table stays, dimmed"],
      [2900, 5300, "The load fails: a calm banner over the old table"],
      [6200, 8300, "Try again shows the skeleton while it runs again"],
      [8600, 10500, "This time the new table arrives"],
    ]);
    setCursor(ms, [[800, 420, 250], [1400, fx, fy], [1800, fx, fy], [5300, fx + 10, fy + 40],
                   [5900, tx, ty], [6400, tx, ty], [7000, 470, 300]], [1500, 6000]);
    setVeil(ms, DURATION);
    freezeAnimations(ms);
  };

  window.renderAt(0);
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img">
<title>A pointer clicks a revenue figure on a dashboard. The whence hex sways in the centre. On the right, a panel lists where the rows went, one step at a time.</title>
<style>
svg{display:block}
.sway{transform-box:view-box;transform-origin:0 0;animation:sway 5.6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;opacity:.14;animation:shadow 5.6s ease-in-out infinite}
.cur{animation:cur 6s cubic-bezier(.45,0,.25,1) infinite}
.rip{transform-box:fill-box;transform-origin:center;opacity:0;animation:rip 6s ease-out infinite}
.r1,.r2,.r3{animation:6s ease-out infinite}
.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}
.cut{transform-box:fill-box;transform-origin:center top;animation:cut 5.6s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.fl{animation:fl 2.8s ease-in-out infinite}
.ui{font-family:Geist,system-ui,sans-serif}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace}
@keyframes sway{0%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-8px) rotate(0deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-8px) rotate(0deg)}100%{transform:translateY(0) rotate(-4deg)}}
@keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:.14}25%,75%{transform:scaleX(.86);opacity:.09}}
@keyframes cur{0%{transform:translate(70px,70px)}22%,34%{transform:translate(0,0)}52%,100%{transform:translate(70px,70px)}}
@keyframes rip{0%,24%{opacity:0;transform:scale(.4)}26%{opacity:.7;transform:scale(.6)}36%,100%{opacity:0;transform:scale(1.4)}}
@keyframes r1{0%,30%{opacity:.15}36%,92%{opacity:1}100%{opacity:.15}}
@keyframes r2{0%,40%{opacity:.15}46%,92%{opacity:1}100%{opacity:.15}}
@keyframes r3{0%,50%{opacity:.15}56%,92%{opacity:1}100%{opacity:.15}}
@keyframes cut{0%,20%,100%{transform:scaleY(1)}45%,80%{transform:scaleY(.55)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="320" fill="#ffffff"/>

<!-- Left: a number on a dashboard, and the pointer that clicks it. -->
<g transform="translate(34 102)">
<rect width="204" height="116" rx="14" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<text x="18" y="34" class="ui" font-size="14" font-weight="600" fill="#566176">Revenue</text>
<text x="18" y="74" class="ui" font-size="27" font-weight="800" fill="#121b31">$4,281,330</text>
<path d="M18 88H186" stroke="#5758a8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
<circle class="rip" cx="176" cy="94" r="16" fill="none" stroke="#5758a8" stroke-width="3"/>
<g class="cur"><path transform="translate(174 86)" d="M1.5 1.2v20l5-4.8 3.3 7.6 3.6-1.6-3.3-7.5h6.9z" fill="#121b31" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/></g>
</g>

<!-- Centre: the whence hex, in the colours of its logo. The beige tops are
     the rows that each step removed. -->
<ellipse class="shadow" cx="400" cy="306" rx="86" ry="7" fill="#121b31"/>
<g transform="translate(400 156)"><g class="sway"><g transform="scale(2.3) translate(-50 -58)">
<path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#f4efe4" stroke="#17202a" stroke-width="4" stroke-linejoin="round"/>
<rect x="24" y="30" width="10" height="44" rx="2" fill="#17202a"/>
<rect class="cut" x="38" y="34" width="10" height="10" rx="2" fill="#d9d0be"/>
<rect x="38" y="45" width="10" height="29" rx="2" fill="#17202a"/>
<rect class="cut" x="52" y="43" width="10" height="9" rx="2" fill="#d9d0be" style="animation-delay:-.4s"/>
<rect x="52" y="53" width="10" height="21" rx="2" fill="#17202a"/>
<rect class="cut" x="66" y="54" width="10" height="7" rx="2" fill="#d9d0be" style="animation-delay:-.8s"/>
<rect x="66" y="62" width="10" height="12" rx="2" fill="#7356d6"/>
<g fill="#7356d6"><circle cx="26" cy="81" r="1.4"/><circle cx="32" cy="81" r="1.4"/><circle cx="38" cy="81" r="1.4"/><circle cx="44" cy="81" r="1.4"/><circle cx="50" cy="81" r="1.4"/><circle cx="56" cy="81" r="1.4"/><circle cx="62" cy="81" r="1.4"/><circle cx="68" cy="81" r="1.4"/><circle cx="74" cy="81" r="1.4"/></g>
<text x="50" y="97" class="ui" font-size="10.5" font-weight="600" fill="#17202a" text-anchor="middle">whence</text>
</g></g></g>

<!-- Right: the panel. Each step appears in turn, with the share it removed. -->
<g transform="translate(560 58)">
<rect width="206" height="204" rx="14" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<text x="16" y="30" class="ui" font-size="13" font-weight="700" fill="#121b31">Where the rows went</text>
<g>
<text x="16" y="56" class="mono" font-size="10.5" fill="#566176">sales</text>
<rect x="16" y="62" width="174" height="10" rx="5" fill="#5758a8"/>
</g>
<g class="r1">
<text x="16" y="96" class="mono" font-size="10.5" fill="#566176">region == "APAC"</text>
<rect x="16" y="102" width="174" height="10" rx="5" fill="#f4e8e1"/>
<rect x="16" y="102" width="62" height="10" rx="5" fill="#5758a8"/>
<text x="190" y="96" class="ui" font-size="10.5" font-weight="700" fill="#7e5644" text-anchor="end">-83%</text>
</g>
<g class="r2">
<text x="16" y="136" class="mono" font-size="10.5" fill="#566176">year &gt;= 2023</text>
<rect x="16" y="142" width="62" height="10" rx="5" fill="#f4e8e1"/>
<rect x="16" y="142" width="26" height="10" rx="5" fill="#5758a8"/>
<text x="190" y="136" class="ui" font-size="10.5" font-weight="700" fill="#7e5644" text-anchor="end">-62%</text>
</g>
<g class="r3">
<text x="16" y="178" class="mono" font-size="10.5" fill="#566176">summarise</text>
<circle cx="22" cy="189" r="5" fill="#7356d6"/>
<text x="34" y="193" class="ui" font-size="10.5" font-weight="600" fill="#121b31">1 row</text>
</g>
</g>

<!-- Pluses and dots, as on the other heroes. -->
<g transform="translate(272 54)"><g class="tw" fill="none" stroke="#5758a8" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(520 272)"><g class="tw" style="animation-delay:-1.4s" fill="none" stroke="#a47864" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(120 268)"><g class="tw" style="animation-delay:-.7s" fill="none" stroke="#7356d6" stroke-width="4" stroke-linecap="round"><path d="M-6 0H6M0 -6V6"/></g></g>
<g transform="translate(518 44)"><circle class="fl" r="5" fill="#a47864"/></g>
<g transform="translate(280 270)"><circle class="fl" style="animation-delay:-1.4s" r="6" fill="#7356d6"/></g>
<g transform="translate(60 56)"><circle class="fl" style="animation-delay:-.7s" r="4" fill="#121b31"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img">
<title>A blog post on the left, with a relative link, an SVG picture and a video. In the middle, an RSS feed passes through feed.mjs. On the right, the copy in the feed has an absolute link, a PNG picture and a still image.</title>
<style>
svg{display:block}
.tw,.fl,.pulse,.dot{transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.8s ease-in-out infinite}
.fl{animation:fl 2.8s ease-in-out infinite}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.dot{animation:dot 2.4s linear infinite}
.d2{animation-delay:-.8s}.d3{animation-delay:-1.6s}
.fix{opacity:1;animation:fix 5.6s ease-in-out infinite}
.old{opacity:0;animation:old 5.6s ease-in-out infinite}
.f2{animation-delay:.4s}.f3{animation-delay:.8s}
.ui{font-family:Geist,system-ui,sans-serif}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dot{0%{transform:translateX(-46px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(46px);opacity:0}}
@keyframes fix{0%,30%{opacity:0}42%,88%{opacity:1}100%{opacity:0}}
@keyframes old{0%,30%{opacity:1}42%,88%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.old{opacity:0}.fix{opacity:1}}
</style>
<rect width="800" height="320" fill="#ffffff"/>

<!-- Left: the post as it is on the blog. -->
<g transform="translate(36 52)">
<rect width="222" height="216" rx="14" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<path d="M0 30H222" stroke="#d5dce7" stroke-width="2"/>
<g fill="#d5dce7"><circle cx="18" cy="15" r="4"/><circle cx="32" cy="15" r="4"/><circle cx="46" cy="15" r="4"/></g>
<rect x="18" y="46" width="128" height="10" rx="5" fill="#121b31"/>
<rect x="18" y="66" width="186" height="7" rx="3.5" fill="#d5dce7"/>
<rect x="18" y="80" width="150" height="7" rx="3.5" fill="#d5dce7"/>
<text x="18" y="108" class="mono" font-size="12" font-weight="600" fill="#5758a8">../../posts/</text>
<rect x="18" y="122" width="86" height="60" rx="8" fill="#ebebfa" stroke="#5758a8" stroke-width="2"/>
<text x="61" y="157" class="mono" font-size="13" font-weight="700" fill="#5758a8" text-anchor="middle">SVG</text>
<rect x="116" y="122" width="88" height="60" rx="8" fill="#121b31"/>
<path d="M152 140v24l19-12z" fill="#ffffff"/>
<text x="18" y="202" class="ui" font-size="11" fill="#566176">the page</text>
</g>

<!-- Middle: the feed, through feed.mjs. -->
<g fill="#a47864"><circle class="dot" cx="306" cy="160" r="5"/><circle class="dot d2" cx="306" cy="160" r="5"/><circle class="dot d3" cx="306" cy="160" r="5"/></g>
<g transform="translate(400 160)"><g class="pulse">
<rect x="-46" y="-46" width="92" height="92" rx="22" fill="#f4e8e1"/>
<circle cx="-18" cy="20" r="7" fill="#a47864"/>
<path d="M-25 -4a24 24 0 0 1 24 24M-25 -22a42 42 0 0 1 42 42" fill="none" stroke="#a47864" stroke-width="8" stroke-linecap="round"/>
</g></g>
<text x="400" y="238" class="mono" font-size="13" font-weight="600" fill="#121b31" text-anchor="middle">feed.mjs</text>
<g fill="#a47864"><circle class="dot" cx="494" cy="160" r="5"/><circle class="dot d2" cx="494" cy="160" r="5"/><circle class="dot d3" cx="494" cy="160" r="5"/></g>

<!-- Right: the copy in the feed. Each part changes in turn. -->
<g transform="translate(542 52)">
<rect width="222" height="216" rx="14" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<path d="M0 30H222" stroke="#d5dce7" stroke-width="2"/>
<g fill="#d5dce7"><circle cx="18" cy="15" r="4"/><circle cx="32" cy="15" r="4"/><circle cx="46" cy="15" r="4"/></g>
<rect x="18" y="46" width="128" height="10" rx="5" fill="#121b31"/>
<rect x="18" y="66" width="186" height="7" rx="3.5" fill="#d5dce7"/>
<rect x="18" y="80" width="150" height="7" rx="3.5" fill="#d5dce7"/>
<text class="old" x="18" y="108" font-size="12" font-weight="600" fill="#5758a8" font-family="Geist Mono,ui-monospace,monospace">../../posts/</text>
<text class="fix" x="18" y="108" font-size="12" font-weight="600" fill="#5758a8" font-family="Geist Mono,ui-monospace,monospace">https://tenmeh...</text>
<rect x="18" y="122" width="86" height="60" rx="8" fill="#ebebfa" stroke="#5758a8" stroke-width="2"/>
<text class="old f2" x="61" y="157" font-size="13" font-weight="700" fill="#5758a8" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace">SVG</text>
<text class="fix f2" x="61" y="157" font-size="13" font-weight="700" fill="#5758a8" text-anchor="middle" font-family="Geist Mono,ui-monospace,monospace">PNG</text>
<rect x="116" y="122" width="88" height="60" rx="8" fill="#121b31"/>
<path class="old f3" d="M152 140v24l19-12z" fill="#ffffff"/>
<g class="fix f3">
<rect x="116" y="122" width="88" height="60" rx="8" fill="#f2f5fb" stroke="#d5dce7" stroke-width="2"/>
<rect x="126" y="134" width="40" height="6" rx="3" fill="#5758a8"/>
<rect x="126" y="146" width="66" height="5" rx="2.5" fill="#d5dce7"/>
<rect x="126" y="156" width="54" height="5" rx="2.5" fill="#d5dce7"/>
<rect x="126" y="166" width="60" height="5" rx="2.5" fill="#d5dce7"/>
</g>
<text x="18" y="202" class="ui" font-size="11" fill="#566176">the feed</text>
</g>

<!-- Pluses and dots, as on the other heroes. -->
<g transform="translate(290 64)"><g class="tw" fill="none" stroke="#5758a8" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(512 270)"><g class="tw" style="animation-delay:-1.4s" fill="none" stroke="#a47864" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(400 46)"><circle class="fl" r="5" fill="#5758a8"/></g>
<g transform="translate(300 268)"><circle class="fl" style="animation-delay:-1.4s" r="6" fill="#a47864"/></g>
<g transform="translate(776 30)"><circle class="fl" style="animation-delay:-.7s" r="4" fill="#121b31"/></g>
</svg>

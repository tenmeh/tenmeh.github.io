<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img">
<title>The centred rewind hex with North to South on the left and a highlighted comparison row on the right.</title>
<style>
svg{display:block}
.sway,.spin,.chev,.tw,.fl,.shadow,.knob,.hop,.dd,.undo,.dotp{transform-box:view-box;transform-origin:0 0}
.sway{animation:sway 5.6s ease-in-out infinite}
.shadow{transform-box:fill-box;transform-origin:center;opacity:.14;animation:shadow 5.6s ease-in-out infinite}
.spin{animation:spin 5.6s infinite}
.chev{animation:nudge 1.4s cubic-bezier(.3,0,.2,1) infinite}
.chev.b{animation-name:nudgeb;animation-delay:-.2s}
.knob{animation:kx 5.6s cubic-bezier(.45,0,.25,1) infinite}
.hop{animation:hop 5.6s infinite}
.dotp{transform-box:fill-box;transform-origin:50% 50%;animation:5.6s infinite}
.d0{animation-name:d0}.d1{animation-name:d1}.d2{animation-name:d2}.d3{animation-name:d3}
.dd{animation:drift 5.6s ease-in-out infinite}
.undo{transform-box:fill-box;transform-origin:center;animation:turn 5.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.fl{animation:fl 2.8s ease-in-out infinite}
.knob{transform:translateX(104px)}.slide{transform:translateX(64px)}
.d0,.d1{transform:scale(1)}.d2,.d3{transform:scale(0)}
@keyframes sway{0%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-8px) rotate(0deg)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-8px) rotate(0deg)}100%{transform:translateY(0) rotate(-4deg)}}
@keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:.14}25%,75%{transform:scaleX(.86);opacity:.09}}
@keyframes spin{0%,36%{transform:rotate(0)}39%{transform:rotate(9deg);animation-timing-function:cubic-bezier(.55,0,.2,1)}53%{transform:rotate(-370deg);animation-timing-function:cubic-bezier(.3,0,.3,1)}58%,100%{transform:rotate(-360deg)}}
@keyframes nudge{0%,100%{transform:translateX(0)}40%{transform:translateX(-3px)}}
@keyframes nudgeb{0%,100%{transform:translateX(0)}40%{transform:translateX(-7px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes turn{0%,36%{transform:rotate(0)}39%{transform:rotate(12deg);animation-timing-function:cubic-bezier(.55,0,.2,1)}53%{transform:rotate(-372deg);animation-timing-function:cubic-bezier(.3,0,.3,1)}58%,100%{transform:rotate(-360deg)}}
@keyframes kx{0%{transform:translateX(0px)}6%{transform:translateX(0px)}11%{transform:translateX(52px)}12%{transform:translateX(52px)}17%{transform:translateX(104px)}18%{transform:translateX(104px)}23%{transform:translateX(156px)}24%{transform:translateX(156px)}29%{transform:translateX(208px)}38%{transform:translateX(208px)}42%{transform:translateX(156px)}42.5%{transform:translateX(156px)}46.5%{transform:translateX(104px)}47%{transform:translateX(104px)}51%{transform:translateX(52px)}51.5%{transform:translateX(52px)}55.5%{transform:translateX(0px)}64%{transform:translateX(0px)}69%{transform:translateX(52px)}70%{transform:translateX(52px)}75%{transform:translateX(104px)}84%{transform:translateX(104px)}92%{transform:translateX(0px)}100%{transform:translateX(0px)}}
@keyframes hop{0%{transform:translateY(0)}6%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}8.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}11%{transform:translateY(0)}12%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}14.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}17%{transform:translateY(0)}18%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}20.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}23%{transform:translateY(0)}24%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}26.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}29%{transform:translateY(0)}38%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}40%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}42%{transform:translateY(0)}42.5%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}44.5%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}46.5%{transform:translateY(0)}47%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}49%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}51%{transform:translateY(0)}51.5%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}53.5%{transform:translateY(-12px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}55.5%{transform:translateY(0)}64%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}66.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}69%{transform:translateY(0)}70%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}72.5%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}75%{transform:translateY(0)}84%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}88%{transform:translateY(-15px);animation-timing-function:cubic-bezier(.6,0,.9,.5)}92%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes d0{0%{transform:scale(0)}6%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}8%{transform:scale(1)}54%{transform:scale(1);animation-timing-function:ease-in}55.5%{transform:scale(0)}64%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}66%{transform:scale(1)}90%{transform:scale(1);animation-timing-function:ease-in}91.5%{transform:scale(0)}100%{transform:scale(0)}}
@keyframes d1{0%{transform:scale(0)}12%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}14%{transform:scale(1)}49.5%{transform:scale(1);animation-timing-function:ease-in}51%{transform:scale(0)}70%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}72%{transform:scale(1)}87%{transform:scale(1);animation-timing-function:ease-in}88.5%{transform:scale(0)}100%{transform:scale(0)}}
@keyframes d2{0%{transform:scale(0)}18%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}20%{transform:scale(1)}45%{transform:scale(1);animation-timing-function:ease-in}46.5%{transform:scale(0)}100%{transform:scale(0)}}
@keyframes d3{0%{transform:scale(0)}24%{transform:scale(0);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}26%{transform:scale(1)}40.5%{transform:scale(1);animation-timing-function:ease-in}42%{transform:scale(0)}100%{transform:scale(0)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ui-text{font-family:"Recursive Sans Linear Static",Recursive,system-ui,sans-serif;font-weight:600;fill:#17202A}
.changed-row{opacity:1;animation:row 5.6s ease-in-out infinite}
.changed-bars{animation:bars 5.6s ease-in-out infinite}
.destination{animation:destination 5.6s ease-in-out infinite}
@keyframes row{0%,25%,90%,100%{opacity:0}40%,75%{opacity:1}}
@keyframes bars{0%,25%,90%,100%{fill:#CFC5B1}40%,75%{fill:#F0A830}}
@keyframes destination{0%,25%,90%,100%{fill:#17202A}40%,75%{fill:#9E2A2B}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
<rect width="800" height="320" rx="20" fill="#FBF8F1"/>
<circle cx="400" cy="160" r="138" fill="#F8E6C2"/>

<g fill="none" stroke="#CFC5B1" stroke-width="4" stroke-linecap="round">
<path d="M30 252H256" stroke-dasharray="1 10"/>

<path d="M544 292q50-26 100 0t100 0" stroke-dasharray="1 10"/>
</g>


<g fill="none" stroke="#555B66" stroke-width="3"><circle cx="40" cy="252" r="7"/><circle cx="92" cy="252" r="7"/><circle cx="144" cy="252" r="7"/><circle cx="196" cy="252" r="7"/></g>
<g transform="translate(40 252)"><circle class="dotp d0" r="8" fill="#F0A830" stroke="#17202A" stroke-width="3.5"/></g><g transform="translate(92 252)"><circle class="dotp d1" r="8" fill="#F0A830" stroke="#17202A" stroke-width="3.5"/></g><g transform="translate(144 252)"><circle class="dotp d2" r="8" fill="#F0A830" stroke="#17202A" stroke-width="3.5"/></g><g transform="translate(196 252)"><circle class="dotp d3" r="8" fill="#F0A830" stroke="#17202A" stroke-width="3.5"/></g>
<g transform="translate(40 252)"><g class="knob"><g class="hop"><g transform="translate(0 -1)"><circle r="11" fill="#17202A"/><circle r="4.5" fill="#F0A830"/></g></g></g></g>

<!-- UI fragments stay in the side areas, clear of the centred hex. -->
<g transform="translate(40 70)"><g class="dd">
<rect width="160" height="40" rx="12" fill="#FBF8F1" stroke="#17202A" stroke-width="4"/>

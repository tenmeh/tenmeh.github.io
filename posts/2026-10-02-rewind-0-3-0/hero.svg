<g transform="translate(238 44)"><g class="tw" style="animation-delay:0s;stroke:#F0A830" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g><g transform="translate(566 250)"><g class="tw" style="animation-delay:-1.4s;stroke:#9E2A2B" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-8.4 0H8.4M0 -8.4V8.4"/></g></g><g transform="translate(214 196)"><g class="tw" style="animation-delay:-0.7s;stroke:#F0A830" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g><g transform="translate(766 130)"><g class="tw" style="animation-delay:-2.1s;stroke:#17202A" fill="none" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>

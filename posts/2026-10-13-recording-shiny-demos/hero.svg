<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img">
<title>A small app window whose slider and bars move in steps, a film strip of three frames with a shutter that moves from frame to frame, and a clock that ticks thirty times a turn.</title>
<style>
svg{display:block}
.knob,.fill,.bar,.hand,.tw,.fl{transform-box:fill-box}
.knob{animation:knob 3s steps(6,end) infinite}
.fill{transform-origin:left center;animation:fill 3s steps(6,end) infinite}
.bar{transform-origin:center bottom;animation:bar 3s steps(6,end) infinite}
.shutter{transform-box:view-box;animation:shutter 1.5s steps(3,end) infinite}
.hand{transform-origin:50% 100%;animation:hand 3s steps(30,end) infinite}
.tw{transform-origin:center;animation:tw 2.8s ease-in-out infinite}
.fl{animation:fl 2.8s ease-in-out infinite}
.mono{font-family:"Geist Mono",ui-monospace,Consolas,monospace;font-weight:600}
@keyframes knob{from{transform:translateX(-194px)}to{transform:translateX(0)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes shutter{from{transform:translateX(0)}to{transform:translateX(231px)}}
@keyframes hand{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="320" fill="#ffffff"/>

<!-- Left: a scene. Its slider and bars move in steps of the clock. -->
<g transform="translate(40 58)">
<rect width="230" height="200" rx="14" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<path d="M0 30H230" stroke="#d5dce7" stroke-width="2"/>
<g fill="#d5dce7"><circle cx="18" cy="15" r="4"/><circle cx="32" cy="15" r="4"/><circle cx="46" cy="15" r="4"/></g>
<text x="18" y="62" class="mono" font-size="15" fill="#5758a8">renderAt(ms)</text>
<rect x="18" y="83" width="194" height="6" rx="3" fill="#d5dce7"/>
<rect class="fill" x="18" y="83" width="194" height="6" rx="3" fill="#5758a8"/>
<circle class="knob" cx="212" cy="86" r="9" fill="#ffffff" stroke="#5758a8" stroke-width="4"/>
<g fill="#d5dce7">
<rect class="bar" style="animation-delay:-.5s" x="26" y="112" width="26" height="66" rx="5"/>
<rect class="bar" style="animation-delay:-1.5s" x="64" y="112" width="26" height="66" rx="5"/>
<rect class="bar" style="animation-delay:-1s;fill:#a47864" x="102" y="112" width="26" height="66" rx="5"/>
<rect class="bar" style="animation-delay:-2.5s" x="140" y="112" width="26" height="66" rx="5"/>
<rect class="bar" style="animation-delay:-2s" x="178" y="112" width="26" height="66" rx="5"/>
</g>
<path d="M18 180H212" stroke="#d5dce7" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Arrows: scene to frames, frames to video. -->
<g fill="none" stroke="#566176" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M286 158H302M296 150l8 8-8 8"/>
<path d="M580 158H596M590 150l8 8-8 8"/>
</g>

<!-- Middle: the film strip. Three frames, each a step of the clock later:
     the knob is further along. The shutter moves from frame to frame. -->
<rect x="318" y="88" width="250" height="140" rx="10" fill="#121b31"/>
<g fill="#f9fbfd" opacity=".85"><rect x="326" y="96" width="9" height="8" rx="2"/><rect x="344" y="96" width="9" height="8" rx="2"/><rect x="362" y="96" width="9" height="8" rx="2"/><rect x="380" y="96" width="9" height="8" rx="2"/><rect x="398" y="96" width="9" height="8" rx="2"/><rect x="416" y="96" width="9" height="8" rx="2"/><rect x="434" y="96" width="9" height="8" rx="2"/><rect x="452" y="96" width="9" height="8" rx="2"/><rect x="470" y="96" width="9" height="8" rx="2"/><rect x="488" y="96" width="9" height="8" rx="2"/><rect x="506" y="96" width="9" height="8" rx="2"/><rect x="524" y="96" width="9" height="8" rx="2"/><rect x="542" y="96" width="9" height="8" rx="2"/><rect x="560" y="96" width="9" height="8" rx="2"/>
<rect x="326" y="212" width="9" height="8" rx="2"/><rect x="344" y="212" width="9" height="8" rx="2"/><rect x="362" y="212" width="9" height="8" rx="2"/><rect x="380" y="212" width="9" height="8" rx="2"/><rect x="398" y="212" width="9" height="8" rx="2"/><rect x="416" y="212" width="9" height="8" rx="2"/><rect x="434" y="212" width="9" height="8" rx="2"/><rect x="452" y="212" width="9" height="8" rx="2"/><rect x="470" y="212" width="9" height="8" rx="2"/><rect x="488" y="212" width="9" height="8" rx="2"/><rect x="506" y="212" width="9" height="8" rx="2"/><rect x="524" y="212" width="9" height="8" rx="2"/><rect x="542" y="212" width="9" height="8" rx="2"/><rect x="560" y="212" width="9" height="8" rx="2"/></g>
<g transform="translate(330 112)"><rect width="72" height="92" rx="6" fill="#f9fbfd"/><rect x="8" y="40" width="56" height="5" rx="2.5" fill="#d5dce7"/><circle cx="14" cy="42.5" r="6" fill="#ffffff" stroke="#5758a8" stroke-width="3"/><text x="36" y="80" class="mono" font-size="11" fill="#566176" text-anchor="middle">0 ms</text></g>
<g transform="translate(407 112)"><rect width="72" height="92" rx="6" fill="#f9fbfd"/><rect x="8" y="40" width="56" height="5" rx="2.5" fill="#d5dce7"/><rect x="8" y="40" width="18" height="5" rx="2.5" fill="#5758a8"/><circle cx="32" cy="42.5" r="6" fill="#ffffff" stroke="#5758a8" stroke-width="3"/><text x="36" y="80" class="mono" font-size="11" fill="#566176" text-anchor="middle">33 ms</text></g>
<g transform="translate(484 112)"><rect width="72" height="92" rx="6" fill="#f9fbfd"/><rect x="8" y="40" width="56" height="5" rx="2.5" fill="#d5dce7"/><rect x="8" y="40" width="36" height="5" rx="2.5" fill="#5758a8"/><circle cx="50" cy="42.5" r="6" fill="#ffffff" stroke="#5758a8" stroke-width="3"/><text x="36" y="80" class="mono" font-size="11" fill="#566176" text-anchor="middle">67 ms</text></g>
<rect class="shutter" x="325" y="107" width="82" height="102" rx="9" fill="none" stroke="#a47864" stroke-width="5"/>

<!-- Right: the clock. It ticks thirty times a turn: 30 frames a second. -->
<g transform="translate(685 148)">
<circle r="58" fill="#f4e8e1"/>
<circle r="44" fill="#ffffff" stroke="#121b31" stroke-width="4"/>
<g stroke="#566176" stroke-width="3" stroke-linecap="round">
<path d="M0 -38V-32"/><path d="M38 0H32"/><path d="M0 38V32"/><path d="M-38 0H-32"/>
</g>
<line class="hand" x1="0" y1="0" x2="0" y2="-30" stroke="#a47864" stroke-width="5" stroke-linecap="round"/>
<circle r="5" fill="#121b31"/>
</g>
<text x="685" y="248" class="mono" font-size="16" fill="#566176" text-anchor="middle">30 fps</text>

<!-- Pluses and dots, as on the other heroes. -->
<g transform="translate(300 52)"><g class="tw" fill="none" stroke="#5758a8" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(560 268)"><g class="tw" style="animation-delay:-1.4s" fill="none" stroke="#a47864" stroke-width="4" stroke-linecap="round"><path d="M-7 0H7M0 -7V7"/></g></g>
<g transform="translate(752 54)"><g class="tw" style="animation-delay:-.7s" fill="none" stroke="#5758a8" stroke-width="4" stroke-linecap="round"><path d="M-6 0H6M0 -6V6"/></g></g>
<g transform="translate(588 56)"><circle class="fl" r="5" fill="#a47864"/></g>
<g transform="translate(296 276)"><circle class="fl" style="animation-delay:-1.4s" r="6" fill="#5758a8"/></g>
<g transform="translate(24 30)"><circle class="fl" style="animation-delay:-.7s" r="4" fill="#121b31"/></g>
</svg>
